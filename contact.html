<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact — Book Keona Ngai, Vancouver Photographer</title>
<meta name="description" content="Enquire about event, brand, corporate or wedding photography with Keona Ngai. Based in Vancouver, serving Metro Vancouver, available for travel.">
<meta name="theme-color" content="#f6f1e9">
<meta name="robots" content="noindex"><!-- PREVIEW ONLY: remove this line at launch -->
<script>document.documentElement.classList.add('js')</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Inter+Tight:wght@400;500&family=Pinyon+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<main>
  <section class="phero wrap">
    <h1 class="h-xl">Tell me about <em>the day</em></h1>
  </section>

  <section class="wrap" style="padding-bottom:clamp(72px,10vw,160px)">
    <div class="contact">
      <aside>
        <p class="lead">Share the date, the venue and what the photos are for. I reply within one business day.</p>
        <ul class="facts" style="margin-top:28px">
          <li><span class="label">Email</span><a class="link" href="mailto:keonangai@gmail.com">keonangai@gmail.com</a></li>
          <li><span class="label">Based in</span><span>Vancouver, BC</span></li>
          <li><span class="label">Rates</span><a class="link" href="services.html">From $300 / 2 hours</a></li>
        </ul>
      </aside>

      <div>
        <!-- PLACEHOLDER FORM — not connected to a backend yet. Wire to Formspree / Netlify Forms / your CRM before launch. -->
        <form data-form>
          <div class="radios">
            <label><input type="radio" name="type" value="Brand event" checked><span class="chip">Brand event</span></label>
            <label><input type="radio" name="type" value="Corporate"><span class="chip">Corporate</span></label>
            <label><input type="radio" name="type" value="Activation"><span class="chip">Activation</span></label>
            <label><input type="radio" name="type" value="Wedding"><span class="chip">Wedding</span></label>
          </div>
          <div class="field2">
            <label class="field"><span class="label">Name</span><input name="name" type="text" autocomplete="name" required></label>
            <label class="field"><span class="label">Email</span><input name="email" type="email" autocomplete="email" required></label>
          </div>
          <label class="field"><span class="label">Event date</span><input name="date" type="date"></label>
          <label class="field"><span class="label">A few details</span><textarea name="message" rows="3"></textarea></label>
          <button class="btn btn--solid" type="submit">Send enquiry →</button>
        </form>
        <div class="form-done" role="status">
          <h2 class="h-lg" data-reveal="mask">Thank you, <em data-form-name>there</em>.</h2>
          <p class="lead" style="margin-top:16px">Your note is in. I'll be in touch within one business day.</p>
        </div>
      </div>
    </div>
  </section>
</main>
<div data-footer></div>
<script src="assets/main.js"></script>
</body>
</html>
